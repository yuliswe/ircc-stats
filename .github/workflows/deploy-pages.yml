name: Deploy site to GitHub Pages

on:
  push:
    branches: ['release']
  workflow_dispatch:

# The deploy job commits the built site to the `gh-pages` branch, so it needs
# write access to repository contents. No Pages/id-token permissions are needed
# because we publish through a branch rather than the Actions artifact source.
permissions:
  contents: write

# Let a newer run supersede an in-flight one rather than queueing behind it.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The raw ATIP PDFs are Git LFS pointers we do not need to build the
        # site, so skip pulling LFS content to keep the checkout small.
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build static export
        # basePath must match the project-site subpath: <user>.github.io/ircc-stats
        env:
          NEXT_PUBLIC_BASE_PATH: /ircc-stats
          # Optional override for the GA4 Measurement ID. The production stream
          # ID is baked into the app, so this only needs to be set as a repo
          # variable (Settings → Secrets and variables → Actions → Variables)
          # named GA_MEASUREMENT_ID to point a build at a different property.
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: npm run build

      # Disable Jekyll so paths beginning with an underscore (e.g. _next) are served.
      - run: touch out/.nojekyll

      # Publish the contents of out/ to the gh-pages branch. GitHub Pages is
      # configured to serve the site from the root of that branch. The action
      # force-pushes a single commit so the branch stays a clean mirror of the
      # latest build rather than accumulating history.
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          # Keep .nojekyll (see above); the action would otherwise not preserve it.
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy site from ${{ github.sha }}'
